   <h1>봉골레 파스타</h1>
   <p>바지락의 <strong>짭조름한 바다 향</strong>을 마늘과 화이트와인으로 살린 <em>이탈리아식</em> 파스타.</p>
   <img src="images/vongole.jpg" alt="바지락과 파슬리를 올린 스파게티 한 접시" width="480">
   <h2>정보</h2>
   <table>
    <tr><th>분량</th><th>시간</th><th>난이도</th></tr>
    <tr><th>2인분</th><th>25분</th><th>쉬움</th></tr>
   </table>
   <h2>
    <ul>
      <li>스파게티면 200g</li>
      <li>해감이 된 바지락 400g</li>
      <li>편으로 썬 마늘 30g</li>
      <li>엑스트라 버진 올리브 오일 1병</li>
    </ul>
   </h2>
   <p>더 알아보기: <a href="https://www.10000recipe.com/recipe/6857119?srsltid=AU7gw4WOrT7wmTtZzJg3hNki5bTlLwsPpg-J5h1c4mAgNYgaRDHBXZ6G">만개의 레시피 봉골레 파스타</a></p>
